<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 720" width="1200" height="720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Research Co-Scientist architecture: requests flow from the Next.js UI through the FastAPI gateway to a worker pool running eight agents over arXiv, ChromaDB and local Ollama models; events stream back over SSE.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0820"/><stop offset=".55" stop-color="#070b18"/><stop offset="1" stop-color="#03141a"/>
    </linearGradient>
    <radialGradient id="glowV" cx=".15" cy=".1" r=".6"><stop offset="0" stop-color="#7c3aed" stop-opacity=".35"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowC" cx=".9" cy=".85" r=".55"><stop offset="0" stop-color="#06b6d4" stop-opacity=".28"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></radialGradient>
    <linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .band { fill: #ffffff08; stroke: #ffffff14; }
      .bandt { fill: #64748b; font-size: 11px; letter-spacing: 3px; font-weight: 600; }
      .node rect { fill: #0f1229; stroke-width: 1.4; }
      .t { fill: #f1f5f9; font-size: 14px; font-weight: 600; }
      .s { fill: #94a3b8; font-size: 10.5px; }
      .wire { fill: none; stroke: url(#edge); stroke-width: 1.6; opacity: .45; }
      .wire.data { stroke: #475569; stroke-dasharray: 3 4; opacity: .7; }
      .wire.loop { stroke: #fbbf24; stroke-dasharray: 6 5; opacity: .8; animation: dash 1s linear infinite; }
      .wire.sse { stroke: #22d3ee; stroke-dasharray: 2 6; opacity: .9; animation: dash .8s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -22; } }
      .agent { animation: active 12s infinite; opacity: .55; }
      @keyframes active { 0%, 12.5% { opacity: 1; } 14%, 100% { opacity: .55; } }
      .halo { fill: none; stroke-width: 2; opacity: 0; animation: halo 12s infinite; }
      @keyframes halo { 0% { opacity: .9; } 12.5% { opacity: .9; } 14%, 100% { opacity: 0; } }
      .lbl { font-size: 10.5px; font-weight: 600; letter-spacing: .5px; }
    </style>
  </defs>

  <rect width="1200" height="720" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="720" rx="22" fill="url(#glowV)"/>
  <rect width="1200" height="720" rx="22" fill="url(#glowC)"/>

  <text x="40" y="44" fill="#e9d5ff" font-size="22" font-weight="700">Research Co-Scientist</text>
  <text x="40" y="66" fill="#67e8f9" font-size="12" letter-spacing="2">MULTI-AGENT · ARXIV-GROUNDED · CRITIC IN THE LOOP · 100% LOCAL MODELS</text>

  <!-- bands -->
  <rect class="band" x="20" y="88" width="1160" height="120" rx="16"/>
  <text class="bandt" x="36" y="108">EXPERIENCE &amp; GATEWAY</text>
  <rect class="band" x="20" y="226" width="1160" height="250" rx="16"/>
  <text class="bandt" x="36" y="246">AGENT WORKFLOW · DETERMINISTIC STATE MACHINE</text>
  <rect class="band" x="20" y="494" width="1160" height="140" rx="16"/>
  <text class="bandt" x="36" y="514">KNOWLEDGE &amp; MODELS</text>

  <!-- ===== wires (drawn first, under nodes) ===== -->
  <path id="w1" class="wire" d="M190,150 L290,150"/>
  <path id="w2" class="wire" d="M480,142 L570,142"/>
  <path id="w3" class="wire" d="M790,150 L870,150"/>
  <path id="w4" class="wire" d="M990,178 C990,250 99,240 99,330"/>
  <path id="a1" class="wire" d="M158,362 L176,362"/>
  <path id="a2" class="wire" d="M294,362 L312,362"/>
  <path id="a3" class="wire" d="M430,362 L448,362"/>
  <path id="a4" class="wire" d="M566,362 L584,362"/>
  <path id="a5" class="wire" d="M702,362 L720,362"/>
  <path id="a6" class="wire" d="M838,362 L856,362"/>
  <path id="a7" class="wire" d="M974,362 L992,362"/>
  <path id="loop" class="wire loop" d="M779,394 C779,462 235,462 235,394"/>
  <path id="sse" class="wire sse" d="M1051,330 C1051,262 690,250 680,178"/>
  <path id="sse2" class="wire sse" d="M570,160 L480,160"/>
  <!-- data links -->
  <path id="d1" class="wire data" d="M235,394 L140,560"/>
  <path id="d1b" class="wire data" d="M235,394 L325,560"/>
  <path id="d2" class="wire data" d="M371,394 L505,560"/>
  <path id="d3" class="wire data" d="M507,394 L690,560"/>
  <path id="d4" class="wire data" d="M99,394 C99,470 820,470 905,560"/>
  <path id="d5" class="wire data" d="M643,394 L930,560"/>
  <path id="d6" class="wire data" d="M779,394 L960,560"/>
  <path id="d7" class="wire data" d="M915,394 L990,560"/>
  <path id="d8" class="wire data" d="M371,394 C371,500 1060,470 1080,560"/>

  <text x="507" y="455" class="lbl" fill="#fbbf24" text-anchor="middle">↺ critic asks for more evidence · ≤ 1 revision (enforced in code)</text>
  <text x="900" y="252" class="lbl" fill="#22d3ee">live events · SSE ≤ 200 ms</text>
  <text x="525" y="132" class="lbl" fill="#a78bfa" text-anchor="middle">REST</text>
  <text x="525" y="176" class="lbl" fill="#22d3ee" text-anchor="middle">SSE</text>
  <text x="830" y="140" class="lbl" fill="#a78bfa" text-anchor="middle">enqueue</text>

  <!-- ===== top band nodes ===== -->
  <g class="node"><rect x="40" y="122" width="150" height="56" rx="12" stroke="#a78bfa"/>
    <text class="t" x="115" y="147" text-anchor="middle">Researcher</text><text class="s" x="115" y="164" text-anchor="middle">asks a question</text></g>
  <g class="node"><rect x="290" y="122" width="190" height="56" rx="12" stroke="#c084fc"/>
    <text class="t" x="385" y="147" text-anchor="middle">Next.js 16 UI</text><text class="s" x="385" y="164" text-anchor="middle">pipeline · activity log · graph</text></g>
  <g class="node"><rect x="570" y="122" width="220" height="56" rx="12" stroke="#38bdf8"/>
    <text class="t" x="680" y="147" text-anchor="middle">FastAPI Gateway</text><text class="s" x="680" y="164" text-anchor="middle">auth · validation · CORS · SSE</text></g>
  <g class="node"><rect x="870" y="122" width="240" height="56" rx="12" stroke="#22d3ee"/>
    <text class="t" x="990" y="147" text-anchor="middle">Worker Pool</text><text class="s" x="990" y="164" text-anchor="middle">bounded queue · CS_WORKERS=2</text></g>

  <!-- ===== agents (each lights up in turn: 12 s cycle / 8 agents) ===== -->
  <g class="node agent" style="animation-delay:0s"><rect x="40" y="330" width="118" height="64" rx="14" stroke="#a78bfa"/>
    <rect class="halo" x="34" y="324" width="130" height="76" rx="18" stroke="#a78bfa" style="animation-delay:0s" filter="url(#glow)"/>
    <text class="t" x="99" y="358" text-anchor="middle">Planner</text><text class="s" x="99" y="376" text-anchor="middle">search queries</text></g>
  <g class="node agent" style="animation-delay:1.5s"><rect x="176" y="330" width="118" height="64" rx="14" stroke="#60a5fa"/>
    <rect class="halo" x="170" y="324" width="130" height="76" rx="18" stroke="#60a5fa" style="animation-delay:1.5s" filter="url(#glow)"/>
    <text class="t" x="235" y="358" text-anchor="middle">arXiv</text><text class="s" x="235" y="376" text-anchor="middle">fetch papers</text></g>
  <g class="node agent" style="animation-delay:3s"><rect x="312" y="330" width="118" height="64" rx="14" stroke="#22d3ee"/>
    <rect class="halo" x="306" y="324" width="130" height="76" rx="18" stroke="#22d3ee" style="animation-delay:3s" filter="url(#glow)"/>
    <text class="t" x="371" y="358" text-anchor="middle">Ranker</text><text class="s" x="371" y="376" text-anchor="middle">embed + top-k</text></g>
  <g class="node agent" style="animation-delay:4.5s"><rect x="448" y="330" width="118" height="64" rx="14" stroke="#818cf8"/>
    <rect class="halo" x="442" y="324" width="130" height="76" rx="18" stroke="#818cf8" style="animation-delay:4.5s" filter="url(#glow)"/>
    <text class="t" x="507" y="358" text-anchor="middle">Reader</text><text class="s" x="507" y="376" text-anchor="middle">full-text PDFs</text></g>
  <g class="node agent" style="animation-delay:6s"><rect x="584" y="330" width="118" height="64" rx="14" stroke="#34d399"/>
    <rect class="halo" x="578" y="324" width="130" height="76" rx="18" stroke="#34d399" style="animation-delay:6s" filter="url(#glow)"/>
    <text class="t" x="643" y="358" text-anchor="middle">Synthesis</text><text class="s" x="643" y="376" text-anchor="middle">hypothesis ± stance</text></g>
  <g class="node agent" style="animation-delay:7.5s"><rect x="720" y="330" width="118" height="64" rx="14" stroke="#fbbf24"/>
    <rect class="halo" x="714" y="324" width="130" height="76" rx="18" stroke="#fbbf24" style="animation-delay:7.5s" filter="url(#glow)"/>
    <text class="t" x="779" y="358" text-anchor="middle">Critic</text><text class="s" x="779" y="376" text-anchor="middle">challenge claims</text></g>
  <g class="node agent" style="animation-delay:9s"><rect x="856" y="330" width="118" height="64" rx="14" stroke="#f472b6"/>
    <rect class="halo" x="850" y="324" width="130" height="76" rx="18" stroke="#f472b6" style="animation-delay:9s" filter="url(#glow)"/>
    <text class="t" x="915" y="358" text-anchor="middle">Final</text><text class="s" x="915" y="376" text-anchor="middle">recommendation</text></g>
  <g class="node agent" style="animation-delay:10.5s"><rect x="992" y="330" width="118" height="64" rx="14" stroke="#f87171"/>
    <rect class="halo" x="986" y="324" width="130" height="76" rx="18" stroke="#f87171" style="animation-delay:10.5s" filter="url(#glow)"/>
    <text class="t" x="1051" y="358" text-anchor="middle">Verifier</text><text class="s" x="1051" y="376" text-anchor="middle">citation gate</text></g>

  <!-- ===== knowledge & models ===== -->
  <g class="node"><rect x="60" y="560" width="160" height="56" rx="12" stroke="#60a5fa"/>
    <text class="t" x="140" y="585" text-anchor="middle">arXiv API</text><text class="s" x="140" y="602" text-anchor="middle">≤ 1 req / 3 s</text></g>
  <g class="node"><rect x="250" y="560" width="150" height="56" rx="12" stroke="#64748b"/>
    <text class="t" x="325" y="585" text-anchor="middle">SQLite cache</text><text class="s" x="325" y="602" text-anchor="middle">24 h search TTL</text></g>
  <g class="node"><rect x="430" y="560" width="150" height="56" rx="12" stroke="#22d3ee"/>
    <text class="t" x="505" y="585" text-anchor="middle">ChromaDB</text><text class="s" x="505" y="602" text-anchor="middle">cosine · per session</text></g>
  <g class="node"><rect x="610" y="560" width="160" height="56" rx="12" stroke="#818cf8"/>
    <text class="t" x="690" y="585" text-anchor="middle">PDF text cache</text><text class="s" x="690" y="602" text-anchor="middle">20 s read budget</text></g>
  <g class="node"><rect x="840" y="560" width="300" height="56" rx="12" stroke="#c084fc"/>
    <text class="t" x="990" y="585" text-anchor="middle">Ollama · local GPU</text><text class="s" x="990" y="602" text-anchor="middle">qwen3.5-4b (think off) · nomic-embed-text</text></g>

  <!-- ===== motion dots ===== -->
  <g filter="url(#glow)">
    <circle r="4" fill="#e9d5ff"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath xlink:href="#w1"/></animateMotion></circle>
    <circle r="4" fill="#c4b5fd"><animateMotion dur="2s" begin=".4s" repeatCount="indefinite"><mpath xlink:href="#w2"/></animateMotion></circle>
    <circle r="4" fill="#7dd3fc"><animateMotion dur="2s" begin=".8s" repeatCount="indefinite"><mpath xlink:href="#w3"/></animateMotion></circle>
    <circle r="4.5" fill="#a5f3fc"><animateMotion dur="3.2s" begin="1s" repeatCount="indefinite"><mpath xlink:href="#w4"/></animateMotion></circle>
    <circle r="3.6" fill="#a78bfa"><animateMotion dur="1.5s" repeatCount="indefinite"><mpath xlink:href="#a1"/></animateMotion></circle>
    <circle r="3.6" fill="#60a5fa"><animateMotion dur="1.5s" begin=".2s" repeatCount="indefinite"><mpath xlink:href="#a2"/></animateMotion></circle>
    <circle r="3.6" fill="#22d3ee"><animateMotion dur="1.5s" begin=".4s" repeatCount="indefinite"><mpath xlink:href="#a3"/></animateMotion></circle>
    <circle r="3.6" fill="#818cf8"><animateMotion dur="1.5s" begin=".6s" repeatCount="indefinite"><mpath xlink:href="#a4"/></animateMotion></circle>
    <circle r="3.6" fill="#34d399"><animateMotion dur="1.5s" begin=".8s" repeatCount="indefinite"><mpath xlink:href="#a5"/></animateMotion></circle>
    <circle r="3.6" fill="#fbbf24"><animateMotion dur="1.5s" begin="1s" repeatCount="indefinite"><mpath xlink:href="#a6"/></animateMotion></circle>
    <circle r="3.6" fill="#f472b6"><animateMotion dur="1.5s" begin="1.2s" repeatCount="indefinite"><mpath xlink:href="#a7"/></animateMotion></circle>
    <circle r="4" fill="#fbbf24"><animateMotion dur="3s" repeatCount="indefinite"><mpath xlink:href="#loop"/></animateMotion></circle>
    <circle r="4" fill="#67e8f9"><animateMotion dur="2.6s" repeatCount="indefinite"><mpath xlink:href="#sse"/></animateMotion></circle>
    <circle r="4" fill="#67e8f9"><animateMotion dur="1.6s" begin=".5s" repeatCount="indefinite"><mpath xlink:href="#sse2"/></animateMotion></circle>
    <circle r="3" fill="#93c5fd"><animateMotion dur="2.2s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath xlink:href="#d1"/></animateMotion></circle>
    <circle r="3" fill="#94a3b8"><animateMotion dur="2.6s" begin=".3s" repeatCount="indefinite"><mpath xlink:href="#d1b"/></animateMotion></circle>
    <circle r="3" fill="#67e8f9"><animateMotion dur="2.2s" begin=".6s" repeatCount="indefinite"><mpath xlink:href="#d2"/></animateMotion></circle>
    <circle r="3" fill="#a5b4fc"><animateMotion dur="2.4s" begin=".9s" repeatCount="indefinite"><mpath xlink:href="#d3"/></animateMotion></circle>
    <circle r="3" fill="#d8b4fe"><animateMotion dur="3.4s" begin=".2s" repeatCount="indefinite"><mpath xlink:href="#d4"/></animateMotion></circle>
    <circle r="3" fill="#d8b4fe"><animateMotion dur="2.4s" begin=".5s" repeatCount="indefinite"><mpath xlink:href="#d5"/></animateMotion></circle>
    <circle r="3" fill="#d8b4fe"><animateMotion dur="2.4s" begin=".8s" repeatCount="indefinite"><mpath xlink:href="#d6"/></animateMotion></circle>
    <circle r="3" fill="#d8b4fe"><animateMotion dur="2.4s" begin="1.1s" repeatCount="indefinite"><mpath xlink:href="#d7"/></animateMotion></circle>
    <circle r="3" fill="#d8b4fe"><animateMotion dur="3.6s" begin="1.4s" repeatCount="indefinite"><mpath xlink:href="#d8"/></animateMotion></circle>
  </g>

  <!-- footer legend -->
  <g font-size="11" fill="#94a3b8">
    <circle cx="48" cy="676" r="4" fill="#c4b5fd" filter="url(#glow)"/><text x="60" y="680">request / control flow</text>
    <line x1="210" y1="676" x2="240" y2="676" stroke="#475569" stroke-dasharray="3 4" stroke-width="1.6"/><text x="248" y="680">data &amp; model calls</text>
    <line x1="388" y1="676" x2="418" y2="676" stroke="#fbbf24" stroke-dasharray="6 5" stroke-width="1.6"/><text x="426" y="680">bounded revision loop</text>
    <line x1="580" y1="676" x2="610" y2="676" stroke="#22d3ee" stroke-dasharray="2 6" stroke-width="1.6"/><text x="618" y="680">live SSE events to the browser</text>
    <text x="1160" y="680" text-anchor="end" fill="#64748b">API &amp; first event &lt; 2 s · end-to-end p95 &lt; 3 min</text>
  </g>
</svg>
